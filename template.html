<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{meta_title}}</title>
    <meta name="description" content="{{meta_description}}">
    <meta name="author" content="Antoni Tomaszewski">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="pl_PL">
    <meta property="og:title" content="{{og_title}}">
    <meta property="og:description" content="{{og_description}}">
    <meta property="og:image" content="{{og_image}}">
    <meta property="og:url" content="{{canonical}}">
    <link rel="canonical" href="{{canonical}}">

    {{structured_data}}

    <link rel="stylesheet" href="{{base}}css/colors.css">
    <link rel="stylesheet" href="{{base}}css/layout.css">
    <link rel="stylesheet" href="{{base}}css/components.css">
    <link rel="icon" href="{{base}}favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
</head>
<body>
    <!-- Ten plik to szablon. Strony generuje: node build.js -->
    <section id="hero" class="{{hero_class}}" style="background-image: url('{{hero}}')">
        <div class="hero-content">
            <a href="{{base}}./" class="site-title">
                <h1 id="main-title">{{hero_title}}</h1>
                <p id="subtitle">{{hero_subtitle}}</p>
            </a>
        </div>
    </section>
    <nav id="main-nav">
{{nav}}
    </nav>

    <main id="content">
{{content}}
    </main>

    <footer id="footer">
{{footer}}
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <script src="{{base}}js/app.js"></script>
</body>
</html>
